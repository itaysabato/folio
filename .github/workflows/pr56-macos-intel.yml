name: PR 56 macOS verification (ARM)
'on':
  push:
    branches:
      - test/pr56-macos-intel
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 39d90cd846795bdb306f49aeb61a8f5ee142ab17
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:chat-math
      - run: node --test scripts/test-word-files.cjs scripts/test-network-security.cjs scripts/test-release-build.mjs
      - run: npm run build
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 restricts the user namespaces Chromium's sandbox needs; installed Folio packages
          # ship an AppArmor profile for this, but the development Electron binary doesn't.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node scripts/test-reader-security.mjs
          xvfb-run -a npm run smoke
      - name: Reader security regressions
        if: runner.os != 'Linux'
        run: node scripts/test-reader-security.mjs
      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: release/smoke/
          if-no-files-found: ignore
    timeout-minutes: 15
